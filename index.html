<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de noticias · Tandil</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTUiIGZpbGw9IiMzNDU0RDEiLz4KICA8Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIxOSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMkZENEJFIiBzdHJva2Utd2lkdGg9IjMuMiIgb3BhY2l0eT0iMC41Ii8+CiAgPGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMTAiIGZpbGw9IiMyRkQ0QkUiLz4KPC9zdmc+Cg==">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F8;
    --bg-elevated: #FFFFFF;
    --bg-sunken: #EAEDF2;
    --text: #14161C;
    --text-muted: #5B6270;
    --text-faint: #8A90A0;
    --border: #E2E6ED;
    --accent-primary: #3454D1;
    --accent-primary-soft: rgba(52, 84, 209, 0.10);
    --accent-tandil: #0E9C8C;
    --accent-nacional: #3454D1;
    --accent-boletin: #B4790E;
    --live-dot: #0E9C8C;
    --danger: #C0392B;
    --shadow: 0 1px 2px rgba(20, 22, 28, 0.04), 0 4px 16px rgba(20, 22, 28, 0.05);
    --radius: 12px;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  html[data-theme="dark"] {
    --bg: #10121A;
    --bg-elevated: #191C28;
    --bg-sunken: #0C0E15;
    --text: #E9EBF2;
    --text-muted: #9BA1B0;
    --text-faint: #656B7C;
    --border: #262A38;
    --accent-primary: #6C87F5;
    --accent-primary-soft: rgba(108, 135, 245, 0.14);
    --accent-tandil: #2FD4BE;
    --accent-nacional: #6C87F5;
    --accent-boletin: #E3A93F;
    --live-dot: #2FD4BE;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  a { color: inherit; }

  /* ===== HEADER / DASHBOARD BAR ===== */
  header {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 20px 0 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .pulse-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--live-dot);
    box-shadow: 0 0 0 0 var(--live-dot);
    animation: pulse-ring 2.2s ease-out infinite;
    flex-shrink: 0;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .clima-widget {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: nowrap;
  }
  .clima-fecha {
    color: var(--text-faint);
  }
  .clima-info {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text);
    font-weight: 500;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    padding: 4px 9px;
    border-radius: 999px;
  }
  .clima-info .icono {
    font-size: 14px;
    line-height: 1;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

  .status-line {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    margin: 6px 0 14px 0;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .status-line .dim { color: var(--text-faint); }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .tab {
    padding: 9px 4px 11px 4px;
    margin-right: 20px;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13.5px;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active[data-cat="Tandil"]   { color: var(--text); border-color: var(--accent-tandil); }
  .tab.active[data-cat="Nacional"] { color: var(--text); border-color: var(--accent-nacional); }
  .tab.active[data-cat="Boletin"]  { color: var(--text); border-color: var(--accent-boletin); }

  /* ===== SEARCH ===== */
  .buscador {
    max-width: 1200px;
    margin: 16px auto 0 auto;
    padding: 0 20px;
  }
  .buscador-wrap {
    position: relative;
    max-width: 420px;
  }
  .buscador-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.45;
    pointer-events: none;
  }
  .buscador input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .buscador input::placeholder { color: var(--text-faint); }
  .buscador input:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-primary-soft);
  }
  .buscador input:disabled { opacity: 0.5; }

  /* ===== MAIN / GRID ===== */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .grid-cat {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .grid-cat.active { display: grid; }

  .tarjeta {
    position: relative;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 16px 14px 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .tarjeta::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .tarjeta.cat-tandil::before   { background: var(--accent-tandil); }
  .tarjeta.cat-nacional::before { background: var(--accent-nacional); }
  .tarjeta.cat-boletin::before  { background: var(--accent-boletin); }

  .tarjeta-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 10px 0;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
  }
  .tarjeta-header h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14.5px;
    margin: 0;
    letter-spacing: -0.005em;
  }
  .tarjeta-header .contador {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.42;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { color: var(--accent-primary); }

  .item .live-dot {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live-dot);
    margin-top: 5px;
    box-shadow: 0 0 0 0 var(--live-dot);
    animation: pulse-ring 2.2s ease-out infinite;
  }
  .item .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }

  .vacio { color: var(--text-faint); font-size: 13px; padding: 4px 0; }

  .desaparecidas {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .desaparecidas summary { cursor: pointer; }
  .desaparecidas summary:hover { color: var(--text-muted); }
  .desaparecidas ul { margin: 6px 0 0 0; padding-left: 16px; font-family: var(--font-body); }

  .oculto { display: none !important; }

  /* ===== BOLETÍN ===== */
  .boletin-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .boletin-header h2 { margin: 0; }
  .boletin-pdf-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-primary-soft);
    color: var(--accent-primary);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 11px;
    border-radius: 7px;
    transition: opacity 0.15s ease;
  }
  .boletin-pdf-link:hover { opacity: 0.75; }

  .boletin-entrada {
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .boletin-entrada:last-child { border-bottom: none; }
  .boletin-chip {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--accent-boletin);
    background: color-mix(in srgb, var(--accent-boletin) 12%, transparent);
    padding: 3px 8px;
    border-radius: 5px;
    margin-bottom: 6px;
  }
  .boletin-resumen {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-muted);
  }

  /* ===== ESTADOS ===== */
  .estado-carga, .estado-error {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .estado-error { color: var(--danger); max-width: 480px; margin: 0 auto; }
  .estado-error button {
    margin-top: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: var(--font-body);
    cursor: pointer;
  }
  .estado-error button:hover { border-color: var(--accent-primary); }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(14, 156, 140, 0.45); }
    70%  { box-shadow: 0 0 0 7px rgba(14, 156, 140, 0); }
    100% { box-shadow: 0 0 0 0 rgba(14, 156, 140, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot, .item .live-dot { animation: none; }
  }

  @media (max-width: 560px) {
    .header-inner { padding: 14px 14px 0 14px; }
    .buscador, main { padding-left: 14px; padding-right: 14px; }
    .brand h1 { font-size: 17px; }
    .clima-fecha { display: none; }
    .header-right { gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <span class="pulse-dot" aria-hidden="true"></span>
        <h1>Panel de noticias</h1>
      </div>
      <div class="header-right">
        <div class="clima-widget" id="clima-widget">
          <span class="clima-fecha" id="clima-fecha">—</span>
          <span class="clima-info" id="clima-info" title="Cargando clima…">···</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">◐</button>
      </div>
    </div>
    <div class="status-line" id="status-line">
      <span>Cargando…</span>
    </div>
    <div class="tabs" role="tablist">
      <div class="tab active" data-cat="Tandil" onclick="switchTab('Tandil')" role="tab">Tandil</div>
      <div class="tab" data-cat="Nacional" onclick="switchTab('Nacional')" role="tab">Nacionales</div>
      <div class="tab" data-cat="Boletin" onclick="switchTab('Boletin')" role="tab">Boletín SIBOM</div>
    </div>
  </div>
</header>

<div class="buscador">
  <div class="buscador-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="buscador-input" type="text" placeholder="Buscar título o medio…" disabled>
  </div>
</div>

<main id="main-content">
  <div class="estado-carga" id="estado-carga">Cargando datos del panel…</div>
</main>

<script>
  // ============================================================
  // CONFIGURACIÓN: URL de la Web App de Apps Script (/exec)
  // ============================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIOK9PXtu47bt4iMmneWMa42toYvPDbesTvU4pYe4f4GIUQMwQbSWRp7_uq7PMbujk/exec";

  let ultimaFechaActualizacion = null;
  let ultimoConteoFuentes = 0;

  function escaparHtml(texto) {
    return String(texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------- TEMA CLARO/OSCURO ----------
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-theme', tema);
    document.getElementById('theme-toggle').textContent = tema === 'dark' ? '☀' : '◐';
    try { localStorage.setItem('panel-tema', tema); } catch (e) {}
  }

  function inicializarTema() {
    let guardado = null;
    try { guardado = localStorage.getItem('panel-tema'); } catch (e) {}
    if (guardado === 'dark' || guardado === 'light') {
      aplicarTema(guardado);
    } else {
      const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      aplicarTema(prefiereOscuro ? 'dark' : 'light');
    }
  }

  document.getElementById('theme-toggle').addEventListener('click', function () {
    const actual = document.documentElement.getAttribute('data-theme');
    aplicarTema(actual === 'dark' ? 'light' : 'dark');
  });

  // ---------- FECHA Y CLIMA ----------
  const TANDIL_COORDS = { lat: -37.3217, lon: -59.1332 }; // fallback si no hay geolocalización
  let ultimasCoordsClima = null;

  const TABLA_CLIMA = {
    0: ['☀️', 'Despejado'], 1: ['🌤️', 'Mayormente despejado'], 2: ['⛅', 'Parcialmente nublado'], 3: ['☁️', 'Nublado'],
    45: ['🌫️', 'Niebla'], 48: ['🌫️', 'Niebla escarchada'],
    51: ['🌦️', 'Llovizna débil'], 53: ['🌦️', 'Llovizna'], 55: ['🌦️', 'Llovizna intensa'],
    56: ['🌧️', 'Llovizna helada'], 57: ['🌧️', 'Llovizna helada intensa'],
    61: ['🌧️', 'Lluvia débil'], 63: ['🌧️', 'Lluvia'], 65: ['🌧️', 'Lluvia intensa'],
    66: ['🌧️', 'Lluvia helada'], 67: ['🌧️', 'Lluvia helada intensa'],
    71: ['🌨️', 'Nieve débil'], 73: ['🌨️', 'Nieve'], 75: ['🌨️', 'Nieve intensa'], 77: ['🌨️', 'Granizo fino'],
    80: ['🌦️', 'Chubascos débiles'], 81: ['🌦️', 'Chubascos'], 82: ['⛈️', 'Chubascos fuertes'],
    85: ['🌨️', 'Chubascos de nieve'], 86: ['🌨️', 'Chubascos de nieve intensos'],
    95: ['⛈️', 'Tormenta'], 96: ['⛈️', 'Tormenta con granizo'], 99: ['⛈️', 'Tormenta con granizo intenso']
  };

  function actualizarFechaHeader() {
    const el = document.getElementById('clima-fecha');
    if (!el) return;
    const ahora = new Date();
    const texto = ahora.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' })
      + ' · ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    el.textContent = texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function cargarClima(lat, lon) {
    ultimasCoordsClima = { lat: lat, lon: lon };
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon
      + '&current_weather=true&timezone=auto';

    fetch(url)
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(data => {
        const cw = data.current_weather;
        const el = document.getElementById('clima-info');
        if (!cw || !el) return;
        const par = TABLA_CLIMA[cw.weathercode] || ['—', 'Sin datos'];
        el.innerHTML = '<span class="icono">' + par[0] + '</span>' + Math.round(cw.temperature) + '°C';
        el.title = par[1];
      })
      .catch(() => {
        const el = document.getElementById('clima-info');
        if (el) { el.textContent = '—'; el.title = 'No se pudo obtener el clima'; }
      });
  }

  function inicializarClima() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { cargarClima(pos.coords.latitude, pos.coords.longitude); },
        function () { cargarClima(TANDIL_COORDS.lat, TANDIL_COORDS.lon); },
        { timeout: 6000 }
      );
    } else {
      cargarClima(TANDIL_COORDS.lat, TANDIL_COORDS.lon);
    }
  }

  // ---------- TABS ----------
  function switchTab(cat) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.grid-cat').forEach(g => {
      g.classList.remove('active');
      g.style.display = 'none';
    });

    document.querySelector('.tab[data-cat="' + cat + '"]').classList.add('active');

    const panel = document.getElementById(cat);
    panel.classList.add('active');
    panel.style.display = 'grid';
  }

  // ---------- TIEMPO RELATIVO ----------
  function formatoRelativo(fecha) {
    const segundos = Math.floor((Date.now() - fecha.getTime()) / 1000);
    if (segundos < 60) return 'hace instantes';
    const minutos = Math.floor(segundos / 60);
    if (minutos < 60) return 'hace ' + minutos + ' min';
    const horas = Math.floor(minutos / 60);
    if (horas < 24) return 'hace ' + horas + (horas === 1 ? ' hora' : ' horas');
    const dias = Math.floor(horas / 24);
    return 'hace ' + dias + (dias === 1 ? ' día' : ' días');
  }

  function actualizarStatusLine() {
    const el = document.getElementById('status-line');
    if (!ultimaFechaActualizacion) return;
    const rel = formatoRelativo(ultimaFechaActualizacion);
    const abs = ultimaFechaActualizacion.toLocaleString('es-AR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    el.innerHTML = 'Actualizado <span title="' + escaparHtml(abs) + '">' + rel + '</span>'
      + ' <span class="dim">·</span> ' + ultimoConteoFuentes + ' fuentes monitoreadas';
  }

  // ---------- RENDER: GRID DE NOTICIAS ----------
  function generarGridNoticias(secciones, id, claseCat) {
    const html = secciones.map(sec => {
      const items = sec.actuales.map(i => {
        const puntoNuevo = i.esNueva
          ? '<span class="live-dot" aria-hidden="true"></span><span class="sr-only">Nueva: </span>'
          : '<span style="width:6px;flex-shrink:0;"></span>';
        return `<a class="item" data-texto="${escaparHtml(i.title.toLowerCase())}" href="${escaparHtml(i.link)}" target="_blank" rel="noopener">${puntoNuevo}<span>${escaparHtml(i.title)}</span></a>`;
      }).join('');
      const des = sec.desaparecidas.length > 0
        ? `<details class="desaparecidas"><summary>${sec.desaparecidas.length} caídas</summary><ul>${sec.desaparecidas.map(d => `<li>${escaparHtml(d.title)}</li>`).join('')}</ul></details>`
        : '';
      return `<section class="tarjeta ${claseCat}" data-sitio="${escaparHtml(sec.nombre.toLowerCase())}">
        <div class="tarjeta-header">
          <h2>${escaparHtml(sec.nombre)}</h2>
          <span class="contador">${sec.actuales.length}</span>
        </div>
        ${items || '<p class="vacio">Sin novedades.</p>'}
        ${des}
      </section>`;
    }).join('');
    return `<div id="${id}" class="grid-cat ${id === 'Tandil' ? 'active' : ''}">${html}</div>`;
  }

  // ---------- RENDER: BOLETÍN ----------
  function generarTabBoletin(bol) {
    if (!bol) {
      return `<div id="Boletin" class="grid-cat" style="grid-template-columns: 1fr;">
        <div class="vacio" style="text-align:center; padding: 50px 20px; width:100%;">Todavía no hay un Boletín Oficial registrado.</div>
      </div>`;
    }

    const titulo = bol.numeroEdicion ? 'Edición Nº ' + bol.numeroEdicion : 'ID ' + bol.id;
    const fecha = bol.fechaPublicacion ? ' · ' + bol.fechaPublicacion : '';

    let html = `<section class="tarjeta cat-boletin" style="grid-column: 1 / -1; max-width: 780px; margin: 0 auto;">`;
    html += `<div class="boletin-header">
      <h2 style="font-family:var(--font-display); font-weight:600; font-size:16px;">Último Boletín: ${escaparHtml(titulo)}<span style="color:var(--text-faint); font-weight:400;">${escaparHtml(fecha)}</span></h2>
      <a class="boletin-pdf-link" href="${escaparHtml(bol.url)}" target="_blank" rel="noopener">↓ PDF original (SIBOM)</a>
    </div>`;

    if (bol.items && bol.items.length > 0) {
      html += `<div style="margin-top:14px;">`;
      bol.items.forEach(i => {
        html += `<div class="boletin-entrada">
          <span class="boletin-chip">${escaparHtml(i.tipo)} Nº ${escaparHtml(i.numero)}</span>
          <div class="boletin-resumen">${escaparHtml(i.resumen)}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<p class="vacio" style="margin-top:14px;">No se pudo extraer el resumen automático de las normas para este boletín.</p>`;
    }

    html += `</section>`;
    return `<div id="Boletin" class="grid-cat" style="display:none; grid-template-columns: 1fr;">${html}</div>`;
  }

  // ---------- RENDER PRINCIPAL ----------
  function renderizarPanel(estado) {
    const main = document.getElementById('main-content');
    const statusEl = document.getElementById('status-line');

    if (!estado || !estado.fecha) {
      main.innerHTML = `<div class="estado-error">Corré el Master Watcher al menos una vez para generar datos.</div>`;
      statusEl.innerHTML = '<span>Sin datos aún</span>';
      return;
    }

    ultimaFechaActualizacion = new Date(estado.fecha);
    ultimoConteoFuentes = (estado.Tandil || []).length + (estado.Nacional || []).length;
    actualizarStatusLine();

    main.innerHTML =
      generarGridNoticias(estado.Tandil || [], 'Tandil', 'cat-tandil') +
      generarGridNoticias(estado.Nacional || [], 'Nacional', 'cat-nacional') +
      generarTabBoletin(estado.Boletin);

    const buscador = document.getElementById('buscador-input');
    buscador.disabled = false;
    buscador.addEventListener('input', function (e) {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.item').forEach(el => el.classList.toggle('oculto', !!q && el.dataset.texto.indexOf(q) === -1));
      document.querySelectorAll('.tarjeta').forEach(card => {
        if (card.parentElement.id === 'Boletin') return;
        const visibles = card.querySelectorAll('.item:not(.oculto)').length;
        card.classList.toggle('oculto', !!q && visibles === 0 && card.dataset.sitio.indexOf(q) === -1);
      });
    });
  }

  function mostrarError(mensaje) {
    document.getElementById('main-content').innerHTML =
      `<div class="estado-error">
         No se pudo cargar el panel.<br><small>${escaparHtml(mensaje)}</small>
         <br><button onclick="cargarDatos()">Reintentar</button>
       </div>`;
    document.getElementById('status-line').innerHTML = '<span>Error al cargar</span>';
  }

  function cargarDatos() {
    document.getElementById('main-content').innerHTML = `<div class="estado-carga">Cargando datos del panel…</div>`;

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGA_ACA') === 0) {
      mostrarError('Falta configurar APPS_SCRIPT_URL en index.html con la URL de tu Web App.');
      return;
    }

    fetch(APPS_SCRIPT_URL)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(estado => renderizarPanel(estado))
      .catch(err => mostrarError(err.message));
  }

  inicializarTema();
  cargarDatos();
  actualizarFechaHeader();
  inicializarClima();
  setInterval(cargarDatos, 5 * 60 * 1000);        // Vuelve a pedir datos cada 5 min
  setInterval(actualizarStatusLine, 30 * 1000);   // Actualiza el "hace X min" cada 30s sin re-fetch
  setInterval(actualizarFechaHeader, 30 * 1000);  // Actualiza el reloj cada 30s
  setInterval(function () {                       // Refresca el clima cada 15 min (sin re-pedir permiso de ubicación)
    if (ultimasCoordsClima) cargarClima(ultimasCoordsClima.lat, ultimasCoordsClima.lon);
  }, 15 * 60 * 1000);
</script>

</body>
</html>
